<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shader Dock</title>
<style>
  :root {
    --bg: #1d1f26;
    --panel: #262933;
    --panel-2: #2f3340;
    --line: #3a3f4d;
    --text: #e6e8ee;
    --muted: #9aa1b2;
    --accent: #4f8cff;
    --ok: #3ccf7a;
    --warn: #f0b429;
    --bad: #f05252;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1 { flex: 1; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.wait { background: var(--warn); }

  .icon-btn {
    display: inline-grid; place-items: center;
    width: 28px; height: 28px; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

  main { padding: 8px; display: grid; gap: 8px; }

  .source {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .source > h2 {
    margin: 0; padding: 6px 10px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); background: var(--panel-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .filter { padding: 8px 10px; border-top: 1px solid var(--line); }
  .source > h2 + .filter { border-top: 0; }
  .filter.off .name, .filter.off .controls { opacity: .5; }

  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name { flex: 1; min-width: 0; }
  .name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .switch { position: relative; width: 30px; height: 17px; flex: none; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 9px; background: var(--line);
    transition: background .15s; pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(13px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

  .controls { margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .controls .icon-btn { border-color: var(--line); background: var(--panel-2); color: var(--text); }
  .controls .icon-btn:hover { border-color: var(--accent); }
  .controls .play.playing { background: var(--accent); border-color: var(--accent); }
  input[type=range] { flex: 1; min-width: 40px; accent-color: var(--accent); margin: 0 4px; }
  .pct { width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .loop { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; cursor: pointer; margin-left: 2px; }
  .loop input { margin: 0; accent-color: var(--accent); }

  .empty { padding: 24px 12px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); margin-bottom: 4px; }

  footer { padding: 4px 10px 10px; color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  footer label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  footer input { accent-color: var(--accent); margin: 0; }

  /* Ventana de conexión */
  dialog {
    width: min(320px, calc(100vw - 24px));
    padding: 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 4px; font-size: 14px; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field span { font-size: 11px; color: var(--muted); }
  .field input[type=text], .field input[type=number], .field input[type=password] {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0 12px; cursor: pointer; }
  .check input { accent-color: var(--accent); margin: 0; }
  .error { color: var(--bad); font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.link { background: transparent; border-color: transparent; color: var(--muted); margin-right: auto; padding-left: 0; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="status-dot" title="Desconectado"></span>
  <h1>Shaders</h1>
  <button class="icon-btn" id="btn-refresh" title="Actualizar lista" aria-label="Actualizar lista">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
  <button class="icon-btn" id="btn-settings" title="Conexión" aria-label="Conexión">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
  </button>
</header>

<main id="list">
  <div class="empty"><b>Conectando…</b></div>
</main>

<footer>
  <label><input type="checkbox" id="show-others"> Mostrar otros shaders</label>
</footer>

<dialog id="dlg">
  <form method="dialog" id="conn-form">
    <h3>Conectar con OBS</h3>
    <p>En OBS: Herramientas → Ajustes del servidor WebSocket. Activa el servidor y copia el puerto y la contraseña.</p>
    <div class="grid2">
      <label class="field"><span>Host</span><input type="text" id="f-host" value="127.0.0.1" required></label>
      <label class="field"><span>Puerto</span><input type="number" id="f-port" value="4455" min="1" max="65535" required></label>
    </div>
    <label class="field"><span>Contraseña</span><input type="password" id="f-pass" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="f-remember" checked> Recordar en este dock</label>
    <div class="error" id="f-error" role="alert"></div>
    <div class="actions">
      <button type="button" class="btn link" id="f-forget">Olvidar datos</button>
      <button type="button" class="btn" id="f-cancel">Cancelar</button>
      <button type="submit" class="btn primary" id="f-connect">Conectar</button>
    </div>
  </form>
</dialog>

<script src="obsws.js"></script>
<script src="shaders.js"></script>
<script src="dock.js"></script>
</body>
</html>
